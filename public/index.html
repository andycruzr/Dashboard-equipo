<style>
  :root{
    --blue:#5B7FC7; --yellow:#D6BE5C; --magenta:#B063A2; --green:#5EA86C;
    --red:#C85A50; --cyan:#4FC2C0;
    color-scheme:dark;
  }
  html{ -webkit-text-size-adjust:100%; }
  body{ background:#141517; color:#E9EAEE; font-family:'Inter Tight',system-ui,sans-serif; }

  .stencil{ font-family:'Archivo',system-ui,sans-serif; font-variation-settings:'wdth' 118,'wght' 800;
            text-transform:uppercase; letter-spacing:.02em; }
  .stencil-thin{ font-family:'Archivo',system-ui,sans-serif; font-variation-settings:'wdth' 118,'wght' 600;
            text-transform:uppercase; letter-spacing:.06em; }
  .tape{ font-family:'JetBrains Mono',ui-monospace,monospace; text-transform:uppercase;
         letter-spacing:.12em; font-size:10px; }

  .slate-seg{ transition:width .55s cubic-bezier(.4,0,.2,1), filter .2s ease; min-width:26px; }
  .slate-seg:hover{ filter:brightness(1.18); }

  .sprocket{ width:7px; height:11px; border-radius:1.5px; background:#33373E; transition:background .25s ease; }
  .sprocket.on{ background:currentColor; }

  .card{ transition:transform .18s ease, border-color .18s ease, background .18s ease; }
  .card:hover{ transform:translateY(-2px); border-color:#3D424A; }
  .card.dragging{ opacity:.35; transform:rotate(-1.2deg) scale(.98); }
  .card.selected{ background:#25282D; border-color:#4B515A; }
  .card.flash{ animation:flash .6s ease; }
  @keyframes flash{ 0%{ box-shadow:0 0 0 0 rgba(255,255,255,.28);} 100%{ box-shadow:0 0 0 14px rgba(255,255,255,0);} }

  .col-drop.over{ background:#202329; outline:1px dashed #4B515A; outline-offset:-4px; }

  .rise{ animation:rise .5s cubic-bezier(.2,.7,.3,1) backwards; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }

  /* ── Gantt ── */
  .g-wrap{ display:grid; grid-template-columns:236px minmax(0,1fr); }
  @media (max-width:640px){ .g-wrap{ grid-template-columns:150px minmax(0,1fr); } }
  .g-labels{ border-right:1px solid #2E3238; background:#1B1D21; }
  .g-scroll{ overflow-x:auto; overflow-y:hidden; }
  .g-row{ height:30px; display:flex; align-items:center; border-bottom:1px solid #232629; }
  .g-row.g-group{ height:36px; background:#1E2126; }
  .g-row:hover{ background:#212429; }
  .g-row.sel{ background:#272A30; }
  .g-bar{ position:absolute; height:13px; border-radius:3px; top:50%; transform:translateY(-50%);
          cursor:pointer; transition:filter .15s ease, box-shadow .15s ease; }
  .g-bar:hover{ filter:brightness(1.22); box-shadow:0 0 0 1px rgba(255,255,255,.25); }
  .g-bar.grp{ height:17px; border-radius:3px; }
  .g-fill{ position:absolute; inset:0; border-radius:3px; background:rgba(20,21,23,.42); }
  .g-fill span{ display:block; height:100%; border-radius:3px 0 0 3px; background:transparent; }
  .g-today{ position:absolute; top:0; bottom:0; width:1px; background:var(--cyan); opacity:.55; }
  .g-hito{ position:absolute; top:0; bottom:0; width:0; border-left:1px dashed rgba(79,194,192,.4); }
  .g-weekend{ position:absolute; top:0; bottom:0; background:rgba(255,255,255,.022); }
  .g-monthline{ position:absolute; top:0; bottom:0; width:1px; background:#2E3238; }

  select.tapeselect{ -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M0 0h8L4 5z' fill='%238E939E'/></svg>");
    background-repeat:no-repeat; background-position:right 6px center; padding-right:18px; }
  select.tapeselect option{ background:#1B1D21; color:#E9EAEE; }

  input[type="text"]::placeholder, textarea::placeholder{ color:#5F646D; }
  input[type="date"]{ font-family:'JetBrains Mono',ui-monospace,monospace; }
  input[type="date"]::-webkit-calendar-picker-indicator{ filter:invert(.55); cursor:pointer; }

  .cal-cell{ transition:background .18s ease; }
  .cal-cell:hover{ background:#1E2126; }
  .cal-cell:hover .cal-add{ opacity:1; }
  .cal-add{ opacity:0; transition:opacity .18s ease; }
  .cal-out{ background:#161719; }
  .cal-chip{ transition:transform .15s ease, filter .15s ease; }
  .cal-chip:hover{ transform:translateX(2px); filter:brightness(1.2); }
  .cal-today-ring{ box-shadow:inset 0 0 0 1px var(--cyan); }

  .modal-in{ animation:modalIn .22s cubic-bezier(.2,.7,.3,1); }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(-8px) scale(.985);} to{ opacity:1; transform:none;} }

  :focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; border-radius:2px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:#141517; }
  ::-webkit-scrollbar-thumb{ background:#2E3238; border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover{ background:#3D424A; }
  .scroll-x{ scrollbar-width:thin; }

  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none !important; transition:none !important; } }
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

const dt = iso => new Date(iso + 'T00:00:00');
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fecha = iso => iso ? `${String(dt(iso).getDate()).padStart(2,'0')} ${MESES[dt(iso).getMonth()]}` : '—';
const diasRestantes = iso => Math.round((dt(iso) - dt(HOY)) / 864e5);
const vencida = t => t.estado !== 'completado' && t.fin && diasRestantes(t.fin) < 0;
const pct = n => Math.round((n || 0) * 100);

function tareasDe(id, campo){ return TAREAS.filter(t => t[campo] === id); }
function rango(ts){
  const f = ts.flatMap(t => [t.inicio, t.fin]).filter(Boolean).sort();
  return f.length ? { inicio:f[0], fin:f[f.length-1] } : null;
}
function avance(ts){
  if (!ts.length) return 0;
  return ts.reduce((s,t) => s + (t.progreso || 0), 0) / ts.length;
}
function estadoGrupo(ts){
  if (!ts.length) return 'pendiente';
  if (ts.every(t => t.estado === 'completado')) return 'completado';
  if (ts.some(t => t.estado === 'proceso')) return 'proceso';
  if (ts.some(t => t.estado === 'revision')) return 'revision';
  return 'pendiente';
}

function avatar(pid, size = 26){
  const p = P(pid);
  return `<span class="grid shrink-0 place-items-center rounded-full font-semibold"
    style="width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;background:${p.color}22;color:${p.color}"
    title="${esc(p.nombre)} · ${esc(p.rol)}">${esc(p.iniciales)}</span>`;
}

function sprockets(t){
  const c = E(t.estado).color;
  const llenos = Math.round((t.progreso || 0) * 5);
  return `<span class="flex gap-[3px]" style="color:${c}" title="Avance ${pct(t.progreso)}%">` +
    [0,1,2,3,4].map(i => `<i class="sprocket ${i < llenos ? 'on' : ''}"></i>`).join('') + `</span>`;
}

let toastTimer;
function toast(texto, color = '#5EA86C'){
  $('#toastText').textContent = texto;
  $('#toastDot').style.background = color;
  $('#toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.add('hidden'), 2600);
}

function visibles(){
  return TAREAS.filter(t => {
    if (state.vista === 'mias' && t.responsable !== 'u-andres') return false;
    if (state.persona  && t.responsable !== state.persona) return false;
    if (state.area     && t.area !== state.area) return false;
    if (state.proyecto && t.proyecto !== state.proyecto) return false;
    if (state.query){
      const p = PR(t.proyecto);
      const hay = [t.titulo, t.codigo, t.area, p && p.nombre, P(t.responsable).nombre].join(' ').toLowerCase();
      if (!hay.includes(state.query)) return false;
    }
    return true;
  });
}

/* ═══ Barra lateral ═══ */

function renderNav(){
  $('#nav').innerHTML = VISTAS.map(v => {
    const on = state.vista === v.id;
    return `<button data-vista="${v.id}"
      class="w-full flex items-center gap-3 rounded-md px-3 py-2 text-[13px] transition
             ${on ? 'bg-panel2 text-ink' : 'text-mute hover:text-ink hover:bg-panel2/60'}">
      <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" class="${on ? 'text-bar-cyan' : 'text-dim'}"><path d="${v.icon}"/></svg>
      <span class="${on ? 'font-medium' : ''}">${v.label}</span>
      ${v.id === 'mias' ? `<span class="tape ml-auto text-dim">${TAREAS.filter(t => t.responsable === 'u-andres' && t.estado !== 'completado').length}</span>` : ''}
    </button>`;
  }).join('');
  $('#nav').querySelectorAll('button').forEach(b =>
    b.onclick = () => { state.vista = b.dataset.vista; cerrarNav(); renderAll(); });
}

function filaCarga(p, grande = false){
  const mias   = tareasDe(p.id, 'responsable');
  const activa = mias.filter(t => t.estado !== 'completado').length;
  const ancho  = Math.min(100, Math.round(activa / p.capacidad * 100));
  const excede = activa > p.capacidad;
  const sel    = state.persona === p.id;
  return `<button data-persona="${p.id}" class="group block w-full text-left ${sel ? '' : 'opacity-90 hover:opacity-100'} transition">
    <div class="flex items-center gap-2 mb-[6px]">
      ${grande ? avatar(p.id, 22) : ''}
      <span class="text-[12px] ${sel ? 'text-ink font-medium' : 'text-mute group-hover:text-ink'} transition">${esc(p.nombre)}</span>
      <span class="tape ml-auto ${excede ? 'text-bar-red' : 'text-dim'}">${activa}/${p.capacidad}</span>
    </div>
    <div class="h-[5px] w-full rounded-full bg-panel2 overflow-hidden">
      <div class="h-full rounded-full transition-[width] duration-500"
           style="width:${ancho}%;background:${excede ? '#C85A50' : p.color}"></div>
    </div></button>`;
}

function renderNavLoad(){
  $('#navLoad').innerHTML = PERSONAS.map(p => filaCarga(p)).join('');
  bindPersonas('#navLoad');
}
function bindPersonas(scope){
  document.querySelectorAll(scope + ' [data-persona]').forEach(b =>
    b.onclick = () => { state.persona = state.persona === b.dataset.persona ? null : b.dataset.persona; renderAll(); });
}

/* ═══ Barra de estado + indicadores ═══ */

function renderSlate(){
  const total = TAREAS.length || 1;
  $('#taskTotal').textContent = TAREAS.length;
  $('#slate').innerHTML = ESTADOS.map(e => {
    const n = TAREAS.filter(t => t.estado === e.id).length;
    return `<div class="slate-seg relative grid place-items-center rounded-[2px]"
      style="width:${n/total*100}%;background:${e.color}" title="${e.nombre}: ${n} tareas">
      <span class="tape font-bold" style="color:rgba(20,21,23,.72)">${n || ''}</span></div>`;
  }).join('');
  $('#slateKey').innerHTML = ESTADOS.map(e => {
    const n = TAREAS.filter(t => t.estado === e.id).length;
    return `<div class="flex items-baseline gap-2">
      <span class="h-2 w-2 rounded-[1px] translate-y-[-1px]" style="background:${e.color}"></span>
      <span class="text-[12px] text-ink">${e.nombre}</span>
      <span class="tape text-dim">${Math.round(n/total*100)}%</span></div>`;
  }).join('');
}

function renderReadouts(){
  const activas    = TAREAS.filter(t => t.estado !== 'completado');
  const sinAsignar = activas.filter(t => t.responsable === 'u-sin').length;
  const sinFecha   = activas.filter(t => !t.inicio && !t.fin).length;
  const av         = pct(avance(TAREAS));
  const prox       = HITOS.filter(h => diasRestantes(h.fecha) >= 0).sort((a,b) => a.fecha < b.fecha ? -1 : 1)[0];

  const celda = (label, valor, sub, color) => `
    <div class="bg-panel px-4 py-4">
      <div class="tape text-dim">${label}</div>
      <div class="stencil mt-2 text-[30px] leading-none" style="color:${color}">${valor}</div>
      <div class="text-[11.5px] text-mute mt-[7px]">${sub}</div>
    </div>`;

  $('#readouts').innerHTML =
    celda('Avance general', av + '%', `${TAREAS.length - activas.length} de ${TAREAS.length} tareas cerradas`, '#E9EAEE') +
    celda('Tareas activas', String(activas.length).padStart(2,'0'), `en ${new Set(activas.map(t => t.proyecto)).size} proyectos`, '#D6BE5C') +
    celda('Sin responsable', String(sinAsignar).padStart(2,'0'), sinAsignar ? 'Falta asignar dueño' : 'Todo asignado', sinAsignar ? '#C85A50' : '#5EA86C') +
    celda('Próximo hito', prox ? diasRestantes(prox.fecha) + 'd' : '—', prox ? esc(prox.titulo) : 'Sin hitos próximos', '#4FC2C0') ;

  window.__sinFecha = sinFecha;
}

/* ═══════════════════════════════════════════════════
   VISTA PRINCIPAL — DIAGRAMA DE GANTT
   ═══════════════════════════════════════════════════ */

function ejeGantt(){
  const fechas = [...TAREAS.flatMap(t => [t.inicio, t.fin]), ...HITOS.map(h => h.fecha)].filter(Boolean).sort();
  const min = dt(fechas[0] || HOY), max = dt(fechas[fechas.length-1] || HOY);
  const inicio = new Date(min.getFullYear(), min.getMonth(), 1);
  const fin    = new Date(max.getFullYear(), max.getMonth() + 1, 0);
  const dias   = Math.round((fin - inicio) / 864e5) + 1;
  return { inicio, fin, dias, ancho: dias * state.zoom };
}
const offsetDias = (eje, iso) => Math.round((dt(iso) - eje.inicio) / 864e5);

function grupos(){
  const ts = visibles();
  if (state.agrupar === 'persona'){
    return PERSONAS.map(p => ({
      id:p.id, nombre:p.nombre, meta:p.rol, color:p.color,
      tareas: ts.filter(t => t.responsable === p.id)
    })).filter(g => g.tareas.length);
  }
  if (state.agrupar === 'area'){
    return AREAS.map(a => ({
      id:'a-' + a, nombre:a, meta:'Área', color:'#8E939E',
      tareas: ts.filter(t => t.area === a)
    })).filter(g => g.tareas.length);
  }
  return PROYECTOS.map(p => ({
    id:p.id, nombre:p.nombre, meta:`${p.seccion} · ${p.area}`, color:E(p.estado).color,
    tareas: ts.filter(t => t.proyecto === p.id)
  })).filter(g => g.tareas.length);
}

function barra(t, eje){
  if (!t.inicio && !t.fin) return `<span class="tape absolute left-2 top-1/2 -translate-y-1/2 text-dim">sin fechas</span>`;
  const ini = t.inicio || t.fin, fin = t.fin || t.inicio;
  const x = offsetDias(eje, ini) * state.zoom;
  const w = Math.max(state.zoom, (offsetDias(eje, fin) - offsetDias(eje, ini) + 1) * state.zoom);
  const e = E(t.estado);
  const rojo = vencida(t);
  return `<div class="g-bar" data-tarea="${t.id}" style="left:${x}px;width:${w}px;background:${e.color}${rojo ? ';box-shadow:0 0 0 1px #C85A50' : ''}"
      title="${esc(t.titulo)} · ${fecha(ini)} – ${fecha(fin)} · ${e.nombre} · ${pct(t.progreso)}%">
      <div class="g-fill"><span style="width:${pct(t.progreso)}%;background:${e.color}"></span></div>
    </div>`;
}

function barraGrupo(g, eje){
  const r = rango(g.tareas);
  if (!r) return `<span class="tape absolute left-2 top-1/2 -translate-y-1/2 text-dim">sin fechas</span>`;
  const x = offsetDias(eje, r.inicio) * state.zoom;
  const w = Math.max(state.zoom, (offsetDias(eje, r.fin) - offsetDias(eje, r.inicio) + 1) * state.zoom);
  const est = state.agrupar === 'proyecto' && PR(g.id) ? PR(g.id).estado : estadoGrupo(g.tareas);
  const c = state.agrupar === 'persona' ? g.color : E(est).color;
  const av = pct(avance(g.tareas));
  return `<div class="g-bar grp" style="left:${x}px;width:${w}px;background:${c}66;border:1px solid ${c}"
      title="${esc(g.nombre)} · ${fecha(r.inicio)} – ${fecha(r.fin)} · ${av}%">
      <div class="g-fill" style="background:transparent"><span style="width:${av}%;background:${c}"></span></div>
    </div>`;
}

function renderGantt(){
  const eje = ejeGantt();
  const gs = grupos();
  if (!gs.length) return vacio('Ningún proyecto coincide con el filtro.');

  /* ── Encabezado del eje ── */
  let meses = '', dias = '', fondo = '';
  let cur = new Date(eje.inicio);
  while (cur <= eje.fin){
    const ultimo = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
    const desde = Math.max(0, offsetDias(eje, toISO(cur)));
    const hasta = Math.min(eje.dias - 1, offsetDias(eje, toISO(ultimo)));
    const w = (hasta - desde + 1) * state.zoom;
    meses += `<div class="stencil-thin absolute text-[10px] text-mute border-l border-line pl-2 h-full flex items-center"
      style="left:${desde*state.zoom}px;width:${w}px">${MESES_L[cur.getMonth()]} ${String(cur.getFullYear()).slice(2)}</div>`;
    fondo += `<div class="g-monthline" style="left:${desde*state.zoom}px"></div>`;
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  for (let i = 0; i < eje.dias; i++){
    const d = new Date(eje.inicio.getFullYear(), eje.inicio.getMonth(), eje.inicio.getDate() + i);
    const finde = d.getDay() === 0 || d.getDay() === 6;
    if (finde) fondo += `<div class="g-weekend" style="left:${i*state.zoom}px;width:${state.zoom}px"></div>`;
    if (state.zoom >= 9 && d.getDay() === 1)
      dias += `<div class="tape absolute text-dim" style="left:${i*state.zoom+2}px;top:4px">${String(d.getDate()).padStart(2,'0')}</div>`;
  }
  const hoyX = offsetDias(eje, HOY) * state.zoom;
  fondo += `<div class="g-today" style="left:${hoyX}px"></div>`;
  let marcas = '';
  HITOS.forEach(h => {
    const x = offsetDias(eje, h.fecha) * state.zoom;
    if (x < 0 || x > eje.ancho) return;
    fondo += `<div class="g-hito" style="left:${x}px"></div>`;
    marcas += `<div class="absolute" style="left:${x-4}px;bottom:5px" title="${esc(h.titulo)} · ${fecha(h.fecha)}">
      <span class="block h-[7px] w-[7px] rotate-45" style="background:var(--cyan)"></span></div>`;
  });

  /* ── Filas ── */
  let etiquetas = '', pistas = '';
  gs.forEach(g => {
    const abierto = state.abiertos.has(g.id);
    const est = state.agrupar === 'proyecto' && PR(g.id) ? PR(g.id).estado : estadoGrupo(g.tareas);
    const c = state.agrupar === 'persona' ? g.color : E(est).color;

    etiquetas += `<div class="g-row g-group cursor-pointer px-3" data-grupo="${g.id}">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"
           class="shrink-0 text-dim transition-transform ${abierto ? 'rotate-90' : ''}"><path d="M3 1.5 6.5 5 3 8.5"/></svg>
      <span class="ml-2 h-[7px] w-[7px] shrink-0 rounded-[1px]" style="background:${c}"></span>
      <span class="ml-2 truncate text-[12px] font-medium">${esc(g.nombre)}</span>
      <span class="tape ml-auto shrink-0 text-dim">${g.tareas.length}</span>
    </div>`;
    pistas += `<div class="g-row g-group relative" data-grupo="${g.id}">${barraGrupo(g, eje)}</div>`;

    if (abierto) g.tareas.forEach(t => {
      const sel = state.seleccion === t.id;
      etiquetas += `<div class="g-row ${sel ? 'sel' : ''} cursor-pointer pl-8 pr-3" data-abrir="${t.id}">
        <span class="h-[6px] w-[6px] shrink-0 rounded-full" style="background:${E(t.estado).color}"></span>
        <span class="ml-2 truncate text-[11.5px] ${t.estado === 'completado' ? 'text-dim' : 'text-mute'}">${esc(t.titulo)}</span>
      </div>`;
      pistas += `<div class="g-row ${sel ? 'sel' : ''} relative" data-abrir="${t.id}">${barra(t, eje)}</div>`;
    });
  });

  const sinFecha = window.__sinFecha || 0;

  return `
  <div class="mb-4 flex flex-wrap items-center gap-2">
    <div class="flex rounded-[4px] border border-line overflow-hidden">
      ${[['proyecto','Proyecto'],['persona','Persona'],['area','Área']].map(([k,l]) => `
        <button data-agrupar="${k}" class="tape px-3 py-[8px] transition"
          style="${state.agrupar===k ? 'background:rgba(79,194,192,.12);color:var(--cyan)' : 'color:#8E939E'}">${l}</button>`).join('')}
    </div>
    <div class="flex rounded-[4px] border border-line overflow-hidden">
      ${[[5,'Mes'],[9,'Semana'],[16,'Día']].map(([z,l]) => `
        <button data-zoom="${z}" class="tape px-3 py-[8px] transition"
          style="${state.zoom===z ? 'background:rgba(79,194,192,.12);color:var(--cyan)' : 'color:#8E939E'}">${l}</button>`).join('')}
    </div>
    <button data-todos="1" class="tape rounded-[4px] border border-line bg-panel px-3 py-[8px] text-mute hover:text-ink hover:border-dim transition">
      ${state.abiertos.size ? 'Contraer todo' : 'Expandir todo'}</button>
    <button data-irhoy="1" class="tape rounded-[4px] border border-line bg-panel px-3 py-[8px] text-mute hover:text-ink hover:border-dim transition">Ir a hoy</button>
    <button id="addEvent" class="tape ml-auto flex items-center gap-1.5 rounded-[4px] border px-3 py-[8px] transition"
      style="border-color:rgba(79,194,192,.45);background:rgba(79,194,192,.12);color:var(--cyan)">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      Agregar</button>
  </div>

  <div class="overflow-hidden rounded-[5px] border border-line">
    <div class="g-wrap">
      <div class="g-labels">
        <div class="h-[44px] border-b border-line flex items-end px-3 pb-2">
          <span class="tape text-dim">${state.agrupar === 'persona' ? 'Persona' : state.agrupar === 'area' ? 'Área' : 'Proyecto'}</span>
        </div>
        ${etiquetas}
      </div>
      <div class="g-scroll" id="gScroll">
        <div style="width:${eje.ancho}px" class="relative">
          <div class="h-[44px] border-b border-line relative">${meses}${dias}${marcas}</div>
          <div class="relative">
            <div class="absolute inset-0 pointer-events-none">${fondo}</div>
            ${pistas}
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2">
    ${ESTADOS.map(e => `<div class="flex items-center gap-2">
      <span class="h-[7px] w-[7px] rounded-[1px]" style="background:${e.color}"></span>
      <span class="text-[11.5px] text-mute">${e.nombre}</span></div>`).join('')}
    <div class="flex items-center gap-2">
      <span class="h-[7px] w-[7px] rotate-45" style="background:var(--cyan)"></span>
      <span class="text-[11.5px] text-mute">Hito</span></div>
    <span class="tape ml-auto ${sinFecha ? 'text-bar-yellow' : 'text-dim'}">${sinFecha} tareas activas sin fecha</span>
  </div>`;
}

function wireGantt(){
  document.querySelectorAll('[data-agrupar]').forEach(b => b.onclick = () => {
    state.agrupar = b.dataset.agrupar; state.abiertos.clear(); renderViewBody();
  });
  document.querySelectorAll('[data-zoom]').forEach(b => b.onclick = () => {
    state.zoom = +b.dataset.zoom; renderViewBody();
  });
  document.querySelectorAll('[data-grupo]').forEach(el => el.onclick = () => {
    const id = el.dataset.grupo;
    state.abiertos.has(id) ? state.abiertos.delete(id) : state.abiertos.add(id);
    renderViewBody();
  });
  const todos = document.querySelector('[data-todos]');
  if (todos) todos.onclick = () => {
    if (state.abiertos.size) state.abiertos.clear();
    else grupos().forEach(g => state.abiertos.add(g.id));
    renderViewBody();
  };
  const irHoy = document.querySelector('[data-irhoy]');
  if (irHoy) irHoy.onclick = () => scrollAHoy(true);
  document.querySelectorAll('[data-tarea]').forEach(b => b.onclick = e => {
    e.stopPropagation(); state.seleccion = b.dataset.tarea; renderAll();
  });
  const add = document.getElementById('addEvent');
  if (add) add.onclick = () => abrirModal(HOY);
  scrollAHoy(false);
}

function scrollAHoy(suave){
  const sc = document.getElementById('gScroll');
  if (!sc) return;
  const eje = ejeGantt();
  const x = Math.max(0, offsetDias(eje, HOY) * state.zoom - sc.clientWidth * 0.35);
  sc.scrollTo({ left:x, behavior: suave ? 'smooth' : 'auto' });
}

/* ═══════════════════════════════════════════════════
   TABLERO
   ═══════════════════════════════════════════════════ */

function tarjeta(t){
  const e = E(t.estado), p = P(t.responsable), proy = PR(t.proyecto);
  const vd = vencida(t);
  return `<article draggable="true" data-id="${t.id}" tabindex="0"
    class="card group relative cursor-grab active:cursor-grabbing rounded-[5px] border border-line bg-panel
           pl-4 pr-3 py-3 ${state.seleccion === t.id ? 'selected' : ''}">
    <span class="absolute left-0 top-0 bottom-0 w-[3px] rounded-l-[5px]" style="background:${e.color}"></span>

    <div class="flex items-center gap-2 mb-2">
      <span class="tape text-dim">${t.codigo}</span>
      ${vd ? `<span class="tape px-1.5 py-[2px] rounded-[2px]" style="background:rgba(200,90,80,.14);color:#C85A50">Vencida</span>` : ''}
      <span class="tape ml-auto ${vd ? 'text-bar-red' : 'text-dim'}">${t.fin ? fecha(t.fin) : 'sin fecha'}</span>
    </div>

    <h4 class="text-[13.5px] leading-snug text-ink mb-1">${esc(t.titulo)}</h4>
    <div class="tape text-dim mb-3 truncate">${esc(proy ? proy.nombre : '—')} · ${esc(t.area)}</div>

    <div class="flex items-center gap-2 mb-3">
      ${sprockets(t)}
      <span class="tape text-dim">${pct(t.progreso)}%</span>
      ${t.comentarios.length ? `<span class="tape ml-auto text-dim">${t.comentarios.length} ✎</span>` : ''}
    </div>

          <span class="tape text-dim">Suelta una tarjeta aquí</span></div>`}

let arrastrando = null;
function wireTablero(){
  document.querySelectorAll('[data-id]').forEach(card => {
    card.addEventListener('dragstart', ev => {
      arrastrando = card.dataset.id; card.classList.add('dragging');
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', arrastrando);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.addEventListener('click', ev => {
      if (ev.target.closest('select')) return;
      state.seleccion = card.dataset.id; renderAll();
    });
    card.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); state.seleccion = card.dataset.id; renderAll(); }
    });
  });
  document.querySelectorAll('[data-estado]').forEach(sel => {
    sel.onchange = ev => moverTarea(sel.dataset.estado, ev.target.value);
    sel.onclick = ev => ev.stopPropagation();
  });
  document.querySelectorAll('[data-col]').forEach(col => {
    col.addEventListener('dragover', ev => { ev.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', ev => {
      ev.preventDefault(); col.classList.remove('over');
      if (arrastrando) moverTarea(arrastrando, col.dataset.col);
      arrastrando = null;
    });
  });
}

function moverTarea(id, estado){
  const t = T(id);
  if (!t || t.estado === estado) return;
  t.estado = estado;
  if (estado === 'completado') t.progreso = 1;
  if (estado === 'pendiente')  t.progreso = 0;
  state.seleccion = id;
  toast(t.codigo + ' → ' + E(estado).nombre, E(estado).color);
  renderAll();
  const c = document.querySelector(`[data-id="${id}"]`);
  if (c) c.classList.add('flash');
}

function renderCalendario(){
  const primero = new Date(state.mes.getFullYear(), state.mes.getMonth(), 1);
  const ultimo  = new Date(state.mes.getFullYear(), state.mes.getMonth() + 1, 0);
  const offset  = (primero.getDay() + 6) % 7;
  const celdas  = Math.ceil((offset + ultimo.getDate()) / 7) * 7;
  const clave   = toISO(primero).slice(0, 7);
  const ts = visibles();
  const nMes = ts.filter(t => t.fin && t.fin.startsWith(clave)).length;
  const nHi  = HITOS.filter(h => h.fecha.startsWith(clave)).length;

  const barra = `
    <div class="mb-4 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-1">
        <button data-cal="prev" aria-label="Mes anterior" class="grid h-[30px] w-[30px] place-items-center rounded-[4px] border border-line bg-panel text-mute hover:text-ink hover:border-dim transition">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
        <button data-cal="next" aria-label="Mes siguiente" class="grid h-[30px] w-[30px] place-items-center rounded-[4px] border border-line bg-panel text-mute hover:text-ink hover:border-dim transition">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
      <div class="min-w-0">
        <div class="stencil text-[15px] leading-none">${MESES_L[primero.getMonth()]} ${primero.getFullYear()}</div>
        <div class="tape text-dim mt-[6px]">${nMes} entregas · ${nHi} hitos</div>
      </div>
      <button data-cal="hoy" class="tape rounded-[4px] border border-line bg-panel px-2.5 py-[8px] text-mute hover:text-ink hover:border-dim transition">Hoy</button>
      <button id="addEvent" class="tape ml-auto flex items-center gap-1.5 rounded-[4px] border px-3 py-[8px] transition"
        style="border-color:rgba(79,194,192,.45);background:rgba(79,194,192,.12);color:var(--cyan)">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
        Agregar evento</button>
    </div>`;

  const head = DIAS.map(d => `<div class="tape bg-panel px-2 py-2 text-dim">${d}</div>`).join('');

  let cuerpo = '';
  for (let i = 0; i < celdas; i++){
    const d = new Date(primero.getFullYear(), primero.getMonth(), i - offset + 1);
    const iso = toISO(d);
    const fuera = d.getMonth() !== primero.getMonth();
    const hoy = iso === HOY;
    const hs = HITOS.filter(h => h.fecha === iso);
    const tk = ts.filter(t => t.fin === iso);
    const items = [...hs.map(h => ({h})), ...tk.map(t => ({t}))];
    const mostrar = items.slice(0, 3), extra = items.length - mostrar.length;

    const chips = mostrar.map(it => {
      if (it.h){
        const h = it.h;
        return `<div class="cal-chip group/h flex items-center gap-1.5 rounded-[3px] px-1.5 py-[3px]"
          style="background:rgba(79,194,192,.14)" title="Hito · ${esc(h.titulo)}">
          <span class="h-[6px] w-[6px] shrink-0 rotate-45" style="background:var(--cyan)"></span>
          <span class="truncate text-[10.5px] leading-tight" style="color:var(--cyan)">${esc(h.titulo)}</span>
          ${h.fijo ? '' : `<button data-delh="${h.id}" title="Quitar" class="ml-auto hidden shrink-0 group-hover/h:block text-[11px] leading-none" style="color:var(--cyan)">&times;</button>`}
        </div>`;
      }
      const t = it.t, e = E(t.estado);
      return `<button data-abrir="${t.id}" class="cal-chip flex w-full items-center gap-1.5 rounded-[3px] px-1.5 py-[3px] text-left hover:bg-panel2"
        title="${esc(t.codigo)} · ${esc(t.titulo)} · ${e.nombre}">
        <span class="h-[6px] w-[6px] shrink-0 rounded-full" style="background:${e.color}"></span>
        <span class="truncate text-[10.5px] leading-tight ${t.estado === 'completado' ? 'text-dim line-through' : 'text-mute'}">${esc(t.titulo)}</span>
      </button>`;
    }).join('');

    cuerpo += `<div class="cal-cell relative min-h-[104px] bg-panel p-1.5 ${fuera ? 'cal-out' : ''} ${hoy ? 'cal-today-ring' : ''}">
      <div class="mb-1.5 flex items-center px-0.5">
        <span class="tape ${hoy ? '' : fuera ? 'text-dim/60' : 'text-dim'}" style="${hoy ? 'color:var(--cyan)' : ''}">${String(d.getDate()).padStart(2,'0')}</span>
        ${hoy ? `<span class="tape ml-1.5" style="color:var(--cyan)">Hoy</span>` : ''}
        <button data-add="${iso}" aria-label="Agregar el ${iso}" class="cal-add ml-auto text-dim hover:text-ink">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
      </div>
      <div class="space-y-[3px]">${chips}${extra > 0 ? `<div class="tape px-1.5 pt-[2px] text-dim">+${extra} más</div>` : ''}</div>
    </div>`;
  }

  return barra + `
    <div class="scroll-x overflow-x-auto">
      <div class="min-w-[720px] overflow-hidden rounded-[5px] border border-line">
        <div class="grid grid-cols-7 gap-px bg-line">${head}</div>
        <div class="grid grid-cols-7 gap-px bg-line">${cuerpo}</div>
      </div>
    </div>
    <p class="tape mt-3 text-dim">Las tareas se ubican en su fecha de entrega</p>`;
}

function wireCalendario(){
  document.querySelectorAll('[data-cal]').forEach(b => b.onclick = () => {
    const m = state.mes;
    if (b.dataset.cal === 'prev') state.mes = new Date(m.getFullYear(), m.getMonth() - 1, 1);
    if (b.dataset.cal === 'next') state.mes = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    if (b.dataset.cal === 'hoy')  state.mes = new Date(2026, 7, 1);
    renderViewBody();
  });
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = ev => { ev.stopPropagation(); abrirModal(b.dataset.add); });
  document.querySelectorAll('[data-delh]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const h = HITOS.find(x => x.id === b.dataset.delh);
    HITOS = HITOS.filter(x => x.id !== b.dataset.delh);
    toast('Hito eliminado: ' + h.titulo, '#C85A50');
    renderAll();
  });
  const add = document.getElementById('addEvent');
  if (add) add.onclick = () => abrirModal(HOY.startsWith(toISO(state.mes).slice(0,7)) ? HOY : toISO(state.mes));
}

  };
  $('#postComment').onclick = enviar;
  $('#commentBox').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); enviar(); }
  });
}

/* ═══════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════ */

function abrirModal(iso){
  state.tipoEvento = 'hito';
  $('#evDate').value = iso || HOY;
  $('#evEnd').value  = iso || HOY;
  $('#evTitle').value = '';
  $('#evError').textContent = '';
  $('#evProyecto').innerHTML = PROYECTOS.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
  $('#evOwner').innerHTML = PERSONAS.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('');
  $('#evStatus').innerHTML = ESTADOS.map(e => `<option value="${e.id}">${e.nombre}</option>`).join('');
  pintarTipo();
  $('#eventModal').classList.remove('hidden');
  setTimeout(() => $('#evTitle').focus(), 40);
}
const cerrarModal = () => $('#eventModal').classList.add('hidden');

function pintarTipo(){
  document.querySelectorAll('[data-kind]').forEach(b => {
    const on = b.dataset.kind === state.tipoEvento;
    b.style.background  = on ? 'rgba(79,194,192,.12)' : 'transparent';
    b.style.borderColor = on ? 'rgba(79,194,192,.45)' : '#2E3238';
    b.style.color       = on ? 'var(--cyan)' : '#8E939E';
  });
  $('#taskFields').classList.toggle('hidden', state.tipoEvento !== 'tarea');
  $('#fieldEnd').classList.toggle('invisible', state.tipoEvento !== 'tarea');
}

function guardarEvento(){
  const titulo = $('#evTitle').value.trim();
  const inicio = $('#evDate').value;
  if (!titulo){ $('#evError').textContent = 'Ponle nombre al evento.'; return; }
  if (!inicio){ $('#evError').textContent = 'Elige una fecha.'; return; }

  if (state.tipoEvento === 'hito'){
    HITOS.push({ id:'h' + (++uid), titulo, fecha:inicio, fijo:false });
    toast('Hito agregado el ' + fecha(inicio), '#4FC2C0');
  } else {
    const fin = $('#evEnd').value || inicio;
    const proyecto = $('#evProyecto').value;
    const t = {
      id:'t' + (++uid), codigo:'T-' + String(TAREAS.length + 1).padStart(3,'0'),
      titulo, proyecto, area:(PR(proyecto) || {}).area || 'SIN ÁREA',
      responsable:$('#evOwner').value, progreso:0, estado:$('#evStatus').value,
      notas:null, inicio, fin: fin < inicio ? inicio : fin, comentarios:[]
    };
    TAREAS.push(t);
    state.seleccion = t.id;
    state.abiertos.add(proyecto);
    toast(t.codigo + ' programada · ' + fecha(inicio), E(t.estado).color);
  }
  const d = dt(inicio);
  state.mes = new Date(d.getFullYear(), d.getMonth(), 1);
  cerrarModal();
  renderAll();
}

/* ═══════════════════════════════════════════════════
   ORQUESTACIÓN
   ═══════════════════════════════════════════════════ */

function renderFiltros(){
  const bar = $('#filterBar');
  const chips = [];
  if (state.persona)  chips.push(['persona',  'Responsable: ' + P(state.persona).nombre]);
  if (state.area)     chips.push(['area',     'Área: ' + state.area]);
  if (state.proyecto) chips.push(['proyecto', 'Proyecto: ' + (PR(state.proyecto) || {}).nombre]);
  if (state.query)    chips.push(['query',    'Búsqueda: ' + state.query]);

  if (!chips.length){ bar.classList.add('hidden'); bar.classList.remove('flex'); bar.innerHTML = ''; return; }
  bar.classList.remove('hidden'); bar.classList.add('flex');
  bar.innerHTML = `<span class="tape text-dim">Filtros</span>` + chips.map(([k, l]) =>
    `<button data-quitar="${k}" class="tape flex items-center gap-1.5 rounded-[3px] border border-line bg-panel px-2.5 py-[6px] text-mute hover:text-ink hover:border-dim transition">${esc(l)} &times;</button>`
  ).join('') + `<button data-quitar="todo" class="tape ml-auto text-dim hover:text-bar-red transition">Limpiar todo</button>`;

  bar.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => {
    const k = b.dataset.quitar;
    if (k === 'todo'){ state.persona = state.area = state.proyecto = null; state.query = ''; $('#search').value = ''; }
    else if (k === 'query'){ state.query = ''; $('#search').value = ''; }
    else state[k] = null;
    renderAll();
  });
}

function renderViewBody(){
  const body = $('#viewBody');
  const lista = visibles();

  const titulo = { gantt:'Cronograma', tablero:'Tablero', calendario:'Calendario',
                   mias:'Mis tareas', proyectos:'Proyectos', equipo:'Equipo' }[state.vista];
  const sub = {
    gantt:'Cada fila es un proyecto o una persona. Toca una fila para ver sus tareas.',
    tablero:'Arrastra una tarjeta entre columnas o cambia su estado desde la tarjeta.',
    calendario:'Cada tarea aparece en su fecha de entrega; los hitos son puntos fijos.',
    mias:'Todo lo asignado a Andrés en el tráfico.',
    proyectos:'Los 21 proyectos del Excel, con su estado y avance.',
    equipo:'Tareas abiertas frente a la capacidad de cada persona.'
  }[state.vista];

  let inner;
  if (state.vista === 'gantt')            inner = renderGantt();
  else if (state.vista === 'calendario')  inner = renderCalendario();
  else if (state.vista === 'proyectos')   inner = renderProyectos();
  else if (state.vista === 'equipo')      inner = renderEquipo();
  else if (!lista.length)                 inner = vacio('Ajusta los filtros o la búsqueda.');
  else                                    inner = renderTablero();

  body.innerHTML = `<div class="mb-5">
      <h2 class="stencil text-[15px]">${titulo}</h2>
      <p class="text-[12.5px] text-dim mt-1.5">${sub}</p>
    </div>${inner}`;

  if (state.vista === 'gantt') wireGantt();
  if (state.vista === 'calendario') wireCalendario();
  if (state.vista === 'tablero' || state.vista === 'mias') wireTablero();

  body.querySelectorAll('[data-abrir]').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    state.seleccion = el.dataset.abrir;
    renderAll();
  });
  body.querySelectorAll('[data-proyecto]').forEach(el => el.onclick = () => {
    state.proyecto = el.dataset.proyecto;
    state.vista = 'gantt';
    state.abiertos.add(el.dataset.proyecto);
    renderAll();
  });
}

function renderAll(){
  renderNav();
  renderNavLoad();
  renderSlate();
  renderReadouts();
  renderFiltros();
  renderViewBody();
  renderRailCarga();
  renderRailDetalle();
  if (typeof Persist !== 'undefined') Persist.schedule();
}

/* ═══════════════════════════════════════════════════
   CHROME
   ═══════════════════════════════════════════════════ */

const abrirNav  = () => { $('#sidebar').classList.remove('-translate-x-full'); $('#scrim').classList.remove('hidden'); };
const cerrarNav = () => { if (window.innerWidth < 1024){ $('#sidebar').classList.add('-translate-x-full'); $('#scrim').classList.add('hidden'); } };

$('#openNav').onclick  = abrirNav;
$('#closeNav').onclick = cerrarNav;
$('#scrim').onclick    = cerrarNav;

document.querySelectorAll('#eventModal [data-close]').forEach(b => b.onclick = cerrarModal);
document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { state.tipoEvento = b.dataset.kind; pintarTipo(); });
$('#evSubmit').onclick = guardarEvento;
$('#evTitle').addEventListener('keydown', ev => { if (ev.key === 'Enter') guardarEvento(); });

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){ cerrarModal(); cerrarNav(); }
  if (ev.key.toLowerCase() === 'n' && !ev.metaKey && !ev.ctrlKey &&
      !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    ev.preventDefault(); abrirModal(HOY);
  }
});

let buscaTimer;
$('#search').addEventListener('input', ev => {
  clearTimeout(buscaTimer);
  buscaTimer = setTimeout(() => { state.query = ev.target.value.trim().toLowerCase(); renderFiltros(); renderViewBody(); }, 140);
});

/* ═══════════════════════════════════════════════════
   PERSISTENCIA
   Drivers: api → window.storage → localStorage → memoria

   No hay que configurar nada. Si la página se sirve desde
   el servidor Express, se detecta solo preguntando por
   /api/health y usa la base de datos. Si la abres como
   archivo suelto, guarda en el navegador.

   API_BASE solo hace falta si el front vive en un dominio
   distinto al de la API (por ejemplo Netlify + Render).
   ═══════════════════════════════════════════════════ */

const API_BASE = '';
const STORE_KEY = 'slate.comms.v1';
const SEMILLA = JSON.stringify({ tareas:TAREAS, proyectos:PROYECTOS, hitos:HITOS });

const Persist = {
  driver:'memory', base:'', version:0, ultimo:null, listo:false, timer:null,

  async detectar(){
    // 1. API explícita, o la del mismo origen si responde
    const candidata = API_BASE || (location.protocol.startsWith('http') ? location.origin : '');
    if (candidata){
      try {
        const r = await fetch(candidata + '/api/health', { cache:'no-store' });
        if (r.ok && (await r.json()).ok){ this.driver = 'api'; this.base = candidata; return; }
      } catch { /* sin backend: seguimos con el navegador */ }
    }
    if (typeof window !== 'undefined' && window.storage && window.storage.get){ this.driver = 'claude'; return; }
    try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); this.driver = 'local'; }
    catch { this.driver = 'memory'; }
  },

  async cargar(){
    await this.detectar();
    try {
      if (this.driver === 'api'){
        const r = await fetch(this.base + '/api/state');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json(); this.version = d.version || 0; return d;
      }
      if (this.driver === 'claude'){
        const r = await window.storage.get(STORE_KEY);
        return r ? JSON.parse(r.value) : null;
      }
      if (this.driver === 'local'){
        const raw = localStorage.getItem(STORE_KEY);
        return raw ? JSON.parse(raw) : null;
      }
    } catch (e){ console.warn('[slate] carga:', e.message); this.estado('error','Sin conexión'); }
    return null;
  },

  foto(){ return JSON.stringify({ tareas:TAREAS, proyectos:PROYECTOS, hitos:HITOS }); },

  schedule(){
    if (!this.listo) return;
    if (this.foto() === this.ultimo) return;
    this.estado('pending','Guardando');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.guardar(), 450);
  },

  async guardar(){
    const foto = this.foto();
    try {
      if (this.driver === 'api'){
        const r = await fetch(this.base + '/api/state', {
          method:'PUT', headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ ...JSON.parse(foto), version:this.version })
        });
        if (r.status === 409){
          const f = await r.json();
          TAREAS = f.tareas; PROYECTOS = f.proyectos; HITOS = f.hitos; this.version = f.version;
          this.ultimo = this.foto(); renderAll();
          toast('Tablero actualizado por un compañero', '#D6BE5C');
          return;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        this.version = (await r.json()).version;
      }
      else if (this.driver === 'claude') await window.storage.set(STORE_KEY, foto);
      else if (this.driver === 'local')  localStorage.setItem(STORE_KEY, foto);
      else { this.estado('memory','Sin guardar'); return; }
      this.ultimo = foto;
      this.estado('ok', 'Guardado ' + new Date().toLocaleTimeString('es-CO', { hour:'2-digit', minute:'2-digit' }));
    } catch (e){ console.warn('[slate] guardar:', e.message); this.estado('error','Error al guardar'); }
  },

  async reiniciar(){
    const s = JSON.parse(SEMILLA);
    TAREAS = s.tareas; PROYECTOS = s.proyectos; HITOS = s.hitos;
    state.seleccion = null; this.ultimo = null;
    try {
      if (this.driver === 'api')         await fetch(this.base + '/api/state/reset', { method:'POST' });
      else if (this.driver === 'claude') await window.storage.delete(STORE_KEY);
      else if (this.driver === 'local')  localStorage.removeItem(STORE_KEY);
    } catch (e){ console.warn('[slate] reset:', e.message); }
    renderAll();
    toast('Datos restaurados desde el Excel', '#C85A50');
  },

  estado(tipo, texto){
    const c = { ok:'#5EA86C', pending:'#D6BE5C', error:'#C85A50', memory:'#8E939E' };
    const dot = document.getElementById('syncDot'), lbl = document.getElementById('syncText');
    if (!dot) return;
    dot.style.background = c[tipo] || '#8E939E';
    lbl.textContent = texto + (this.driver === 'memory' ? '' : ' · ' + this.driver);
  },

  suscribir(){
    if (this.driver !== 'api' || typeof EventSource === 'undefined') return;
    const es = new EventSource(this.base + '/api/events');
    es.onmessage = ev => {
      const d = JSON.parse(ev.data);
      if (d.version === this.version) return;
      TAREAS = d.tareas; PROYECTOS = d.proyectos; HITOS = d.hitos; this.version = d.version;
      this.ultimo = this.foto(); renderAll();
      toast('Cambios de un compañero', '#4FC2C0');
    };
    es.onerror = () => this.estado('error','Reconectando');
  }
};

$('#syncPill').onclick = () => Persist.guardar();
$('#resetBoard').onclick = () => { if (confirm('¿Restaurar los datos originales del Excel y borrar los cambios guardados?')) Persist.reiniciar(); };

/* ═══ Arranque ═══ */

(async function arranque(){
  const g = await Persist.cargar();
  if (g && Array.isArray(g.tareas) && g.tareas.length){
    TAREAS = g.tareas;
    if (Array.isArray(g.proyectos)) PROYECTOS = g.proyectos;
    if (Array.isArray(g.hitos)) HITOS = g.hitos;
  }
  renderAll();
  Persist.ultimo = Persist.foto();
  Persist.listo = true;
  Persist.estado(Persist.driver === 'memory' ? 'memory' : 'ok',
                 Persist.driver === 'memory' ? 'Sin guardar' : 'Al día');
  Persist.suscribir();
})();

</script>
