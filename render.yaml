# Plano de despliegue para Render.
# En Render: New → Blueprint → conecta el repo → Apply.
# Crea la base y el servicio web, y los conecta solo.

databases:
  - name: slate-db
    databaseName: slate
    plan: free

services:
  - type: web
    name: trafico-comms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: STORAGE
        value: postgres
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slate-db
          property: connectionString
      - key: USUARIO_ACCESO
        value: comms
      - key: CLAVE_ACCESO
        generateValue: true   # Render genera una y la muestra en el panel
